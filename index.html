  <title>作业成绩查询</title>
  <style>
    :root{color-scheme:light;--ink:#1b2925;--muted:#69716c;--line:#dde3dd;--green:#285445;--paper:#f5f6f0}

<body>
<div class="shell">
  <header><span class="mark" aria-hidden="true">∑</span><span>课程作业</span><span class="header-note">成绩查询</span></header>
  <main>
    <section class="intro" aria-labelledby="page-title">
      <div class="eyebrow">COURSE ASSIGNMENTS</div>
      <h1 id="page-title">每一次练习，<br>都有反馈。</h1>
      <p class="lead">输入姓名和学号，查看已发布的作业成绩及提交情况。</p>
      <div class="course"><strong id="course-name">高等数学 A（一）</strong><div class="term" id="course-term"></div></div>
    </section>
    <section class="card" aria-labelledby="form-title">
      <h2 id="form-title">作业成绩查询</h2>
      <p class="card-description">请填写课程名单中的姓名和 10 位学号。</p>
      <form id="lookup-form" autocomplete="off" novalidate>
        <div class="field"><label for="assignment">查询作业</label><select id="assignment" required></select></div>
        <div class="field"><label for="student-name">姓名</label><input id="student-name" type="text" placeholder="请输入完整姓名" maxlength="80" required autocomplete="off" spellcheck="false"></div>
        <div class="field"><label for="student-id">学号</label><input id="student-id" type="text" placeholder="请输入 10 位学号" maxlength="20" inputmode="numeric" required autocomplete="off" spellcheck="false" aria-describedby="id-hint"><p class="hint" id="id-hint">姓名和学号需同时匹配。</p></div>
        <button class="submit" id="query-button" type="submit">查询成绩</button>
      </form>
      <p id="error" class="error" role="alert" hidden></p>
      <section id="result" class="result" aria-live="polite" aria-atomic="true" tabindex="-1" hidden>
        <div class="result-caption" id="result-title"></div><div class="grade" id="grade"></div><div class="result-person" id="result-person"></div><p class="result-note" id="result-note"></p><button class="clear" id="clear-button" type="button">清除查询结果</button>
      </section>
      <p class="footnote">无需注册或登录</p>
      <noscript><p class="error">请启用浏览器的 JavaScript 后查询成绩。</p></noscript>
    </section>
  </main>
  <footer><span>成绩有疑问，请联系任课教师或助教。</span><span id="updated-at"></span></footer>
</div>

<script>
/* Shared by the student page and the local update tool. No network requests. */
const GradeCrypto = (() => {
  const encoder = new TextEncoder();
  const decoder = new TextDecoder();
  const ITERATIONS = 600000;
  const normalize = (s) => String(s ?? '').normalize('NFKC').trim();
  const to64 = (bytes) => btoa(String.fromCharCode(...new Uint8Array(bytes)));
  const from64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const random64 = (n) => to64(crypto.getRandomValues(new Uint8Array(n)));
  const serialize = (value) => JSON.stringify(value).replace(/</g, '\\u003c').replace(/\u2028/g, '\\u2028').replace(/\u2029/g, '\\u2029');
  function checkIdentity(name, studentId) {
    name = normalize(name); studentId = normalize(studentId);
    if (!name || name.length > 80 || /[\u0000-\u001f\u007f]/.test(name)) throw new Error('请填写完整姓名。');
    if (!/^\d{10}$/.test(studentId)) throw new Error('请填写 10 位数字学号。');
    return {name, studentId};
  }
  function checkBook(book) {
    if (!book || book.format !== 'homework-lookup-v1' || !Array.isArray(book.assignments)) throw new Error('这不是本工具生成的查分网站文件。');
    for (const a of book.assignments) {
      if (!a.id || !a.label || !a.salt || !a.records || Array.isArray(a.records) || !Number.isInteger(a.iterations) || a.iterations < 100000 || a.iterations > 2000000) throw new Error('网站成绩数据格式不正确。');
    }
    return book;
  }
  async function material(name, studentId, salt, iterations) {
    const identity = checkIdentity(name, studentId);
    const password = encoder.encode(JSON.stringify([identity.name, identity.studentId]));
    const root = await crypto.subtle.importKey('raw', password, 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({name:'PBKDF2', hash:'SHA-256', salt:from64(salt), iterations}, root, 256);
    const hmac = await crypto.subtle.importKey('raw', bits, {name:'HMAC',hash:'SHA-256'}, false, ['sign']);
    const [index, keyBytes] = await Promise.all([
      crypto.subtle.sign('HMAC', hmac, encoder.encode('homework-lookup:index:v1')),
      crypto.subtle.sign('HMAC', hmac, encoder.encode('homework-lookup:encryption:v1'))
    ]);
    const key = await crypto.subtle.importKey('raw', keyBytes, 'AES-GCM', false, ['encrypt','decrypt']);
    return {index:to64(index), key};
  }
  const aad = (assignmentId, index) => encoder.encode(JSON.stringify(['homework-lookup-v1', assignmentId, index]));
  async function createAssignment(label, rows, progress = () => {}) {
    const assignment = {id:normalize(label),label:normalize(label),updatedAt:new Date().toISOString(),salt:random64(24),iterations:ITERATIONS,records:{}};
    if (!assignment.id || assignment.id.length > 60) throw new Error('请填写不超过 60 字的作业名称。');
    if (!rows.length) throw new Error('没有可以发布的学生记录。');
    for (let i = 0; i < rows.length; i++) {
      const row = rows[i];
      const {index,key} = await material(row.name,row.studentId,assignment.salt,assignment.iterations);
      if (Object.hasOwn(assignment.records,index)) throw new Error('存在重复的姓名与学号，请先删除重复行。');
      const iv = random64(12);
      const grade = row.grade == null || normalize(row.grade) === '' ? '未交' : normalize(row.grade);
      const encrypted = await crypto.subtle.encrypt({name:'AES-GCM',iv:from64(iv),additionalData:aad(assignment.id,index)},key,encoder.encode(serialize({grade})));
      assignment.records[index] = {iv, data:to64(encrypted)};
      progress(i + 1, rows.length);
    }
    return assignment;
  }
  async function lookup(assignment, name, studentId) {
    const {index,key} = await material(name,studentId,assignment.salt,assignment.iterations);
    const record = assignment.records[index];
    if (!record) return null;
    const clear = await crypto.subtle.decrypt({name:'AES-GCM',iv:from64(record.iv),additionalData:aad(assignment.id,index)},key,from64(record.data));
    const result = JSON.parse(decoder.decode(clear));
    if (typeof result.grade !== 'string') throw new Error('成绩记录格式不正确。');
    return result;
  }
  return {normalize,checkIdentity,checkBook,createAssignment,lookup,serialize};
})();

(() => {
  const $ = (id) => document.getElementById(id);
  const form=$('lookup-form'), button=$('query-button'), nameInput=$('student-name'), idInput=$('student-id');
  let book, revision=0, busy=false;
  const showError=(message)=>{$('error').textContent=message;$('error').hidden=false;};
  const clearResult=()=>{revision++;$('result').hidden=true;$('error').hidden=true;nameInput.removeAttribute('aria-invalid');idInput.removeAttribute('aria-invalid');};
  function showDate(){const a=book.assignments.find(x=>x.id===$('assignment').value);$('updated-at').textContent=a?'更新于 '+new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(a.updatedAt)):'';}
  try {
    if (!globalThis.crypto?.subtle) throw new Error('当前浏览器不支持查询，请使用新版 Chrome、Edge 或 Safari，并通过 HTTPS 链接打开。');
    book=GradeCrypto.checkBook(JSON.parse($('gradebook').textContent));
    $('course-name').textContent=book.course; $('course-term').textContent=book.term;
    for(const a of book.assignments){const option=document.createElement('option');option.value=a.id;option.textContent=a.label;$('assignment').append(option);}
    if(!book.assignments.length) throw new Error('尚未发布作业成绩。');
    $('assignment').value=book.assignments.at(-1).id;
    showDate();
  } catch(error){showError(error.message);button.disabled=true;return;}
  [nameInput,idInput].forEach(input=>input.addEventListener('input',clearResult));
  $('assignment').addEventListener('change',()=>{clearResult();showDate();});
  $('clear-button').addEventListener('click',()=>{form.reset();$('assignment').value=book.assignments.at(-1).id;clearResult();showDate();nameInput.focus();});
  window.addEventListener('pagehide',()=>{form.reset();clearResult();});
  window.addEventListener('pageshow',()=>{form.reset();$('assignment').value=book.assignments.at(-1).id;clearResult();showDate();});
  form.addEventListener('submit',async(event)=>{
    event.preventDefault();if(busy)return;clearResult();
    let identity;
    try {identity=GradeCrypto.checkIdentity(nameInput.value,idInput.value);}catch(error){const input=GradeCrypto.normalize(nameInput.value)?idInput:nameInput;input.setAttribute('aria-invalid','true');showError(error.message);input.focus();return;}
    const assignment=book.assignments.find(a=>a.id===$('assignment').value), queryRevision=revision;
    busy=true;button.disabled=true;button.textContent='正在查询…';form.setAttribute('aria-busy','true');
    try {
      const found=await GradeCrypto.lookup(assignment,identity.name,identity.studentId);
      if(queryRevision!==revision)return;
      if(!found){showError('姓名与学号未匹配，请核对输入；仍无法查询时请联系助教。');return;}
      const missing=found.grade==='未交';
      $('result-title').textContent=assignment.label+' · 查询结果';$('grade').textContent=found.grade;
      $('result-person').textContent=identity.name+' · '+identity.studentId;
      $('result-note').textContent=missing?'本次作业暂无提交记录。':'已记录本次作业成绩。';
      $('result').dataset.state=missing?'missing':'graded';$('result').hidden=false;$('result').focus();
    } catch {if(queryRevision===revision)showError('暂时无法读取成绩，请刷新后重试，或联系助教。');}
    finally {busy=false;button.disabled=false;button.textContent='查询成绩';form.removeAttribute('aria-busy');}
  });
})();
